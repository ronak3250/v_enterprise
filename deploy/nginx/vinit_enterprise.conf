# -----------------------------------------------------------------------------
# Nginx Virtual Host Configuration for Vinit Enterprise
# Place this file in /etc/nginx/sites-available/ and symlink to /etc/nginx/sites-enabled/
# -----------------------------------------------------------------------------

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name vinitenterprise.in www.vinitenterprise.in;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vinitenterprise.in www.vinitenterprise.in;

    root /var/www/vinit_enterprise/build/web;
    index index.html;

    # SSL Certificates (Configure path to your SSL certificate files or Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/vinitenterprise.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vinitenterprise.in/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/wasm
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # Flutter Web SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (images, fonts, wasm, compiled js)
    location ~* \.(?:css|js|wasm|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Do NOT cache index.html, flutter_service_worker.js, and version.json
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /flutter_service_worker.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /version.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
